<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EC Service — Operator Console</title>
<style>
  :root { color-scheme: light dark; --bg:#f7f7f8; --card:#fff; --ink:#1a1a1a; --muted:#666; --line:#e3e3e6; --accent:#2557d6; --ok:#1a7f37; --warn:#b7791f; }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16171a; --card:#1f2024; --ink:#e9e9ec; --muted:#9aa0a6; --line:#33343a; --accent:#7aa2ff; } }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--muted); font-size:12px; }
  main { padding:20px; max-width:900px; margin:0 auto; }
  .bar { display:flex; gap:8px; margin-bottom:16px; align-items:center; }
  button { font:inherit; padding:6px 12px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); cursor:pointer; }
  button.primary { background:var(--accent); color:#fff; border-color:transparent; }
  .task { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; margin-bottom:12px; }
  .task h3 { margin:0 0 4px; font-size:14px; text-transform:uppercase; letter-spacing:.04em; }
  .task .meta { color:var(--muted); font-size:12px; margin-bottom:10px; word-break:break-all; }
  .task .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input[type=text] { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--ink); min-width:160px; }
  .empty { color:var(--muted); text-align:center; padding:40px; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--muted); }
  code { background:var(--bg); padding:1px 5px; border-radius:4px; }
</style>
</head>
<body>
<header>
  <h1>EC Service — Operator Console</h1>
  <span class="sub">clears CAPTCHA / OTP / review tasks parked by the retrieval workers</span>
</header>
<main>
  <div class="bar">
    <button id="refresh" class="primary">Refresh</button>
    <span class="pill" id="count">–</span>
    <span class="sub" style="margin-left:auto">auto-refresh 5s · <a href="/dashboard">project dashboard →</a></span>
  </div>
  <div id="list"></div>
</main>
<script>
const list = document.getElementById('list');
const countEl = document.getElementById('count');

async function load() {
  let tasks = [];
  try {
    const res = await fetch('/ops/tasks?status=open');
    tasks = (await res.json()).tasks || [];
  } catch (e) {
    list.innerHTML = '<div class="empty">Service not reachable. Start it with <code>npm run dev</code>.</div>';
    return;
  }
  countEl.textContent = tasks.length + ' open';
  if (!tasks.length) {
    list.innerHTML = '<div class="empty">No open tasks. When a worker hits a CAPTCHA / OTP / ambiguous result it appears here.</div>';
    return;
  }
  list.innerHTML = '';
  for (const t of tasks) list.appendChild(render(t));
}

function render(t) {
  const el = document.createElement('div');
  el.className = 'task';
  const ctx = JSON.stringify(t.context || {});
  el.innerHTML = `
    <h3>${t.kind.replace('_',' ')}</h3>
    <div class="meta">request <code>${t.requestId}</code> · task <code>${t.id}</code> · opened ${new Date(t.createdAt).toLocaleTimeString()}<br>context: <code>${ctx}</code></div>
    <div class="row" data-kind="${t.kind}"></div>`;
  const row = el.querySelector('.row');

  if (t.kind === 'captcha' || t.kind === 'otp') {
    const input = document.createElement('input');
    input.type = 'text';
    input.placeholder = t.kind === 'captcha' ? 'CAPTCHA text' : 'OTP code';
    const send = document.createElement('button');
    send.className = 'primary'; send.textContent = 'Submit';
    send.onclick = () => answer(t.id, { kind: t.kind, value: input.value });
    row.append(input, send);
  } else if (t.kind === 'nil_review') {
    const yes = document.createElement('button');
    yes.textContent = 'Confirm: genuinely NO entries';
    yes.onclick = () => answer(t.id, { kind: 'nil_review', confirmedNil: true });
    const no = document.createElement('button');
    no.textContent = 'Not verified / wrong keys';
    no.onclick = () => answer(t.id, { kind: 'nil_review', confirmedNil: false });
    row.append(yes, no);
  } else if (t.kind === 'ocr_review') {
    const ok = document.createElement('button');
    ok.className = 'primary'; ok.textContent = 'Accept parsed values';
    ok.onclick = () => answer(t.id, { kind: 'ocr_review', corrections: {} });
    row.append(ok);
  }
  return el;
}

async function answer(id, body) {
  await fetch(`/ops/tasks/${id}/answer`, {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-operator-id': 'console-user' },
    body: JSON.stringify(body),
  });
  load();
}

document.getElementById('refresh').onclick = load;
load();
setInterval(load, 5000);
</script>
</body>
</html>
